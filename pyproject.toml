[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.119.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.37",
    "pydantic-settings>=2.6.0",
    "typer>=0.12.0",
    "tzdata>=2024.1",  # IANA tz database for zoneinfo (Windows has no system one)
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
